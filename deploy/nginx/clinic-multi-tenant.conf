# ==============================================================================
# Multi-Tenant Clinic Management System - High-Performance Nginx Architecture
# ==============================================================================
# Architecture:
# - Single shared static frontend bundle (/var/www/clinic-management/apps/web/dist)
# - Single shared backend API instance listening exclusively on 127.0.0.1:3001
# - Zero cross-origin requests: Static app & /api are served from the SAME origin
# - Tenant resolution strictly performed via Host / X-Forwarded-Host header
# - Cloudflare real_ip module guarantees authenticated patient IP forwarding
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Cloudflare IP Ranges for Trusted Real-IP Restoration
# ------------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# ------------------------------------------------------------------------------
# 2. Upstream Backend Definition
# ------------------------------------------------------------------------------
upstream clinic_backend_api {
    server 127.0.0.1:3001;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 3. Tenant 1: AK's Elite Dental Clinic (Madurai)
# Domains: aksdental.com, www.aksdental.com, aksdental.duckdns.org
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name aksdental.com www.aksdental.com aksdental.duckdns.org;

    # SSL Certificates (managed via Certbot or Cloudflare Origin CA)
    # ssl_certificate /etc/letsencrypt/live/aksdental.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aksdental.com/privkey.pem;

    # Shared frontend SPA build
    root /var/www/clinic-management/apps/web/dist;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static Assets with Long Expiry
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-Origin API Proxy
    location /api/ {
        proxy_pass http://clinic_backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Mandatory Tenant Identity Headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 4. Tenant 2: Jacobs Dental Clinic (Nagercoil / Vellore)
# Domains: jacobdental.com, www.jacobdental.com, jacobdental.duckdns.org
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name jacobdental.com www.jacobdental.com jacobdental.duckdns.org;

    # SSL Certificates
    # ssl_certificate /etc/letsencrypt/live/jacobdental.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jacobdental.com/privkey.pem;

    # Shared frontend SPA build (the exact same artifacts directory)
    root /var/www/clinic-management/apps/web/dist;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-Origin API Proxy for Jacobs Dental Clinic
    location /api/ {
        proxy_pass http://clinic_backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Mandatory Tenant Identity Headers (identifies incoming host as Jacobs)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        client_max_body_size 25M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
